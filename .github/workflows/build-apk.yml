
name: Build Crypto Vision APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          set -euo pipefail
          unzip -o CryptoVision_Black_24_Android_Source.zip -d .
          test -f android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use installed Android SDK
        run: |
          echo "SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoVisionBlack-install-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
